# BCADM Defender Workflow
# -----------------------
# This workflow integrates static analysis, constraint validation,
# and safety‑contract checks into the BCADM development cycle.
#
# BCADM Defender runs automated analysis tools to ensure:
# - constraint definitions remain consistent
# - decision‑path logic is deterministic
# - safety‑contract rules are not violated
# - simulation modules remain reproducible
#
# This workflow uses third‑party GitHub Actions governed by
# their own terms of service and privacy policies.

name: "BCADM Defender"

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
  schedule:
    - cron: '22 8 * * 2'   # Weekly Tuesday run at 08:22

permissions:
  contents: read
  security-events: write

jobs:
  bcadm-defender:
    runs-on: windows-latest   # BCADM analysis currently validated on Windows runners

    steps:
    - name: Checkout BCADM repository
      uses: actions/checkout@v7

    - name: Setup .NET for BCADM tooling
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          6.0.x

    # BCADM Static Analysis & Safety‑Contract Validation
    - name: Run BCADM Defender Analysis
      uses: microsoft/security-devops-action@v1.12.0
      id: bcadm_defender

    # Upload SARIF results to GitHub Security tab
    - name: Upload BCADM Defender Results
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.bcadm_defender.outputs.sarifFile }}

