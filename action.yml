name: "Bruce Constraint‑Aware Decision Module (BCADM)"
description: "Runs the BCADM multi‑constraint simulation loop, evaluates requested poses, applies boundary‑aware clamping, and outputs full safety‑aware action‑contracts."
author: "Bruce"

inputs:
  steps:
    description: "Number of simulation steps to run (each step produces a full multi‑constraint action‑contract with requested, achieved, clamped, and recovery-state fields)"
    required: false
    default: "10"

runs:
  using: "docker"
  image: "Dockerfile"

branding:
  icon: "cpu"
  color: "blue"
