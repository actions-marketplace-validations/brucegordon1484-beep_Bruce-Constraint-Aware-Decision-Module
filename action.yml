name: "Bruce Constraint‑Aware Decision Module (BCADM)"
description: "Runs the BCADM multi‑constraint decision loop, clamps unsafe actions, and outputs full safety‑aware action‑contracts."
author: "Bruce"

inputs:
  steps:
    description: "Number of simulation steps to run (each step returns a full multi‑constraint action‑contract)"
    required: false
    default: "10"

runs:
  using: "docker"
  image: "Dockerfile"

branding:
  icon: "cpu"
  color: "blue"
